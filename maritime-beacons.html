<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balises Maritimes — Temps Réel</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', monospace;
      background: #0a0a0a;
      color: #c8c8c8;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #header {
      background: #0d0d0d;
      border-bottom: 1px solid #1e1e1e;
      padding: 0.55rem 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    h1 {
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #555;
      white-space: nowrap;
      margin-right: 0.25rem;
    }

    input, select, button {
      background: #111;
      border: 1px solid #333;
      color: #c8c8c8;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      padding: 0.38rem 0.6rem;
      outline: none;
    }
    input:focus, select:focus { border-color: #666; }

    button {
      cursor: pointer;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: background 0.12s;
    }
    button:hover { background: #1a1a1a; }

    #api-key { width: 210px; font-size: 0.78rem; }
    #region  { width: 155px; }

    .filter-btn { color: #666; }
    .filter-btn.active { color: #ccc; border-color: #555; }

    #connect-btn { border-color: #334d3e; color: #77aa88; }
    #connect-btn:hover { background: #0c140f; }
    #connect-btn.connected { border-color: #4a7a4a; color: #88cc88; }

    #status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #2a2a2a;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    #status-dot.connecting { background: #aa8833; animation: blink 0.9s infinite; }
    #status-dot.connected  { background: #44aa66; }
    #status-dot.error      { background: #aa4444; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }

    #status-text {
      font-size: 0.7rem;
      color: #555;
      white-space: nowrap;
      min-width: 80px;
    }

    #map-container { flex: 1; position: relative; overflow: hidden; }
    #map { width: 100%; height: 100%; background: #111; }

    /* ── panneau flottant ───────────────────────────── */
    #panel {
      position: absolute;
      top: 10px; right: 10px;
      width: 230px;
      background: rgba(8,8,8,0.93);
      border: 1px solid #1e1e1e;
      z-index: 1000;
      max-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
    }

    #panel-title {
      padding: 0.45rem 0.75rem;
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #3a3a3a;
      border-bottom: 1px solid #181818;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #panel-title span { color: #555; }

    #panel-stats {
      padding: 0.45rem 0.75rem;
      font-size: 0.7rem;
      color: #555;
      border-bottom: 1px solid #181818;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.2rem 0.5rem;
    }
    #panel-stats .val { color: #888; }

    #panel-search {
      padding: 0.35rem 0.5rem;
      border-bottom: 1px solid #181818;
    }
    #panel-search input {
      width: 100%;
      font-size: 0.72rem;
      padding: 0.3rem 0.5rem;
      background: #0d0d0d;
      border-color: #222;
    }

    #panel-list {
      overflow-y: auto;
      flex: 1;
    }
    #panel-list::-webkit-scrollbar { width: 4px; }
    #panel-list::-webkit-scrollbar-track { background: #111; }
    #panel-list::-webkit-scrollbar-thumb { background: #2a2a2a; }

    .obj-item {
      padding: 0.38rem 0.75rem;
      border-bottom: 1px solid #0f0f0f;
      cursor: pointer;
      transition: background 0.1s;
    }
    .obj-item:hover   { background: #101010; }
    .obj-item.focused { background: #131820; border-left: 2px solid #3d5a7a; padding-left: calc(0.75rem - 2px); }

    .oi-name {
      font-size: 0.72rem;
      color: #aaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .oi-meta {
      font-size: 0.62rem;
      color: #3a3a3a;
      margin-top: 0.1rem;
    }

    /* ── couleurs sémantiques ───────────────────────── */
    .t-beacon  { color: #c0a030; }
    .t-vessel  { color: #3090b0; }
    .t-offpos  { color: #b03030; }
    .t-mobile  { color: #6080c0; }

    /* ── popup Leaflet ──────────────────────────────── */
    .leaflet-popup-content-wrapper {
      background: #101010 !important;
      border: 1px solid #2a2a2a;
      border-radius: 0;
      box-shadow: 0 3px 12px rgba(0,0,0,0.85);
    }
    .leaflet-popup-tip-container { display: none; }
    .leaflet-popup-content {
      font-family: 'Courier New', monospace;
      font-size: 0.74rem;
      color: #c0c0c0;
      margin: 0.7rem 0.9rem !important;
      line-height: 1.9;
    }
    .popup-name {
      font-size: 0.88rem;
      color: #e0e0e0;
      border-bottom: 1px solid #222;
      padding-bottom: 0.3rem;
      margin-bottom: 0.4rem;
    }
    .popup-row { display: flex; justify-content: space-between; gap: 0.5rem; }
    .popup-row .k { color: #3a3a3a; }
    .popup-row .v { color: #999; text-align: right; }

    /* attribution */
    .leaflet-control-attribution { font-size: 0.5rem !important; background: rgba(0,0,0,0.7) !important; color: #444 !important; }
    .leaflet-control-attribution a { color: #555 !important; }
    .leaflet-control-zoom a { background: #111 !important; color: #888 !important; border-color: #2a2a2a !important; }
    .leaflet-control-zoom a:hover { background: #1a1a1a !important; }
  </style>
</head>
<body>

<div id="header">
  <h1>Balises Maritimes</h1>

  <input id="api-key" type="password" placeholder="Clé API aisstream.io" autocomplete="off" />

  <select id="region">
    <option value="manche">Manche &amp; Mer du Nord</option>
    <option value="france">Côtes françaises</option>
    <option value="europe">Europe</option>
    <option value="mediterranee">Méditerranée</option>
    <option value="atlantique">Atlantique Nord</option>
    <option value="monde">Monde</option>
  </select>

  <button id="use-view-btn" title="Utiliser la zone visible sur la carte">Vue carte</button>

  <button class="filter-btn active" id="filter-beacons" title="Afficher les balises AIS (AtoN)">⚓ Balises</button>
  <button class="filter-btn active" id="filter-vessels" title="Afficher les navires">⛵ Navires</button>

  <button id="connect-btn">Connecter</button>
  <div id="status-dot"></div>
  <span id="status-text">non connecté — <a href="https://aisstream.io" target="_blank" style="color:#444;text-decoration:none">aisstream.io</a></span>
</div>

<div id="map-container">
  <div id="map"></div>

  <div id="panel">
    <div id="panel-title">
      Objets suivis <span id="panel-count">0</span>
    </div>

    <div id="panel-stats">
      <div>⚓ Balises</div>  <div class="val" id="cnt-beacons">0</div>
      <div>⛵ Navires</div>  <div class="val" id="cnt-vessels">0</div>
      <div>↕ Mobiles</div>  <div class="val" id="cnt-mobile">0</div>
      <div>✉ Messages</div> <div class="val" id="cnt-msgs">0</div>
    </div>

    <div id="panel-search">
      <input type="text" id="search" placeholder="filtrer…" />
    </div>

    <div id="panel-list"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── constantes ────────────────────────────────────────────────────

const ATON_NAMES = {
  0:'Défaut', 1:'Référence', 2:'Point de référence', 3:'RACON',
  4:'Structure fixe', 5:'Réservé',
  6:'Feu sans secteur', 7:'Feu avec secteurs',
  8:'Feu avant', 9:'Feu arrière',
  10:'Balise cardinal N', 11:'Balise cardinal E',
  12:'Balise cardinal S', 13:'Balise cardinal O',
  14:'Réservé', 15:'Balise bâbord', 16:'Balise tribord',
  17:'Balise canal préféré bâbord', 18:'Balise canal préféré tribord',
  19:'Balise danger isolé', 20:'Balise eaux sûres',
  21:'Balise marque spéciale', 22:'Navire-feu / LANBY',
  23:'Bouée cardinal N', 24:'Bouée cardinal E',
  25:'Bouée cardinal S', 26:'Bouée cardinal O',
  27:'Réservé',
  28:'Bouée bâbord', 29:'Bouée tribord',
  30:'Bouée canal préféré bâbord', 31:'Bouée canal préféré tribord',
  32:'Bouée danger isolé', 33:'Bouée eaux sûres',
  34:'Bouée marque spéciale', 35:'Navire-feu / FAD',
  36:'Bouée spar rouge', 37:'Bouée spar verte'
};

const REGIONS = {
  manche:       [[48, -5],  [62, 10]],
  france:       [[43, -5],  [51,  9]],
  europe:       [[35, -15], [72, 45]],
  mediterranee: [[30, -6],  [47, 36]],
  atlantique:   [[30, -80], [65,  0]],
  monde:        [[-90,-180],[90, 180]]
};

const HISTORY_MAX = 120;   // positions conservées par objet
const MOVE_THR    = 5e-4;  // ~50 m en degrés pour qualifier un objet de « mobile »

// ── état ──────────────────────────────────────────────────────────

let ws             = null;
let customBbox     = null;
let filterBeacons  = true;
let filterVessels  = true;
let msgCount       = 0;
let focusedMmsi    = null;
let searchTerm     = '';

const objects = new Map(); // mmsi (number) -> { marker, polyline, positions[], data }

// ── carte ─────────────────────────────────────────────────────────

const map = L.map('map', { preferCanvas: true }).setView([49, 2], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org">OSM</a>',
  maxZoom: 19
}).addTo(map);

L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openseamap.org">OpenSeaMap</a>',
  maxZoom: 19, opacity: 0.75
}).addTo(map);

// ── icônes SVG ────────────────────────────────────────────────────

function beaconIcon(offPos, mobile) {
  const c = offPos ? '#c04040' : mobile ? '#5577cc' : '#c8a020';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
    <circle cx="11" cy="11" r="9" fill="${c}" fill-opacity="0.85" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    <text x="11" y="15.5" text-anchor="middle" font-size="11" fill="rgba(0,0,0,0.7)">⚓</text>
  </svg>`;
  return L.divIcon({
    html: svg, iconSize: [22,22], iconAnchor: [11,11], className: ''
  });
}

function vesselIcon(heading) {
  const rot = (heading >= 0 && heading <= 360) ? heading : 0;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22"
      style="transform:rotate(${rot}deg);transform-origin:center;">
    <polygon points="11,2 18,20 11,16 4,20" fill="#2a88b0" fill-opacity="0.9"
             stroke="rgba(255,255,255,0.25)" stroke-width="1.2"/>
  </svg>`;
  return L.divIcon({
    html: svg, iconSize: [22,22], iconAnchor: [11,11], className: ''
  });
}

// ── gestion des objets ────────────────────────────────────────────

function isMobile(positions) {
  if (positions.length < 2) return false;
  const f = positions[0];
  return positions.some(p =>
    Math.abs(p.lat - f.lat) > MOVE_THR || Math.abs(p.lon - f.lon) > MOVE_THR
  );
}

function hslForMmsi(mmsi) {
  let h = 0;
  const s = String(mmsi);
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return `hsl(${h % 360},45%,50%)`;
}

function invalidCoord(lat, lon) {
  return lat == null || lon == null
    || lat === 0 && lon === 0
    || lat < -90 || lat > 90
    || lon < -180 || lon > 180;
}

function updateObject(info) {
  const { mmsi, lat, lon } = info;
  if (!mmsi || invalidCoord(lat, lon)) return;

  const now = Date.now();

  if (!objects.has(mmsi)) {
    const polyline = L.polyline([], {
      color: hslForMmsi(mmsi),
      weight: 1.5,
      opacity: 0.65
    }).addTo(map);

    const marker = L.marker([lat, lon], { icon: beaconIcon(false, false) })
      .addTo(map)
      .on('click', () => openPopup(mmsi));

    objects.set(mmsi, { marker, polyline, positions: [], data: {} });
  }

  const obj = objects.get(mmsi);
  obj.data = { ...obj.data, ...info, lastSeen: now };
  obj.positions.push({ lat, lon, time: now });
  if (obj.positions.length > HISTORY_MAX) obj.positions.shift();

  const mobile = isMobile(obj.positions);
  const icon   = info.type === 'vessel'
    ? vesselIcon(info.heading ?? 511)
    : beaconIcon(!!info.offPos, mobile);

  obj.marker.setLatLng([lat, lon]).setIcon(icon);

  if (mobile && obj.positions.length > 1) {
    obj.polyline.setLatLngs(obj.positions.map(p => [p.lat, p.lon]));
  }

  renderPanel();
}

// ── popup ─────────────────────────────────────────────────────────

function openPopup(mmsi) {
  focusedMmsi = mmsi;
  const obj = objects.get(mmsi);
  if (!obj) return;
  const d = obj.data;

  const lastSeen = d.lastSeen
    ? new Date(d.lastSeen).toLocaleTimeString('fr-FR')
    : '—';
  const mobile = isMobile(obj.positions);

  let html = `<div class="popup-name">${esc(d.name || `MMSI ${mmsi}`)}</div>`;

  const rows = [
    ['MMSI',      d.mmsi],
    ['Type',      d.type === 'beacon' ? (ATON_NAMES[d.subtype] || 'Balise AIS') : 'Navire'],
    ['Position',  `${d.lat?.toFixed(5)}, ${d.lon?.toFixed(5)}`],
    d.type === 'vessel' && d.speed != null
      ? ['Vitesse', `${d.speed} nœuds`] : null,
    d.type === 'vessel' && d.heading != null && d.heading < 511
      ? ['Cap',     `${d.heading}°`] : null,
    d.offPos
      ? ['⚠ Position', '<span style="color:#c04040">hors position</span>'] : null,
    ['Mobilité',  mobile
      ? `<span class="t-mobile">${obj.positions.length} pts enregistrés</span>`
      : 'fixe'],
    ['Dernière MAJ', lastSeen]
  ];

  rows.filter(Boolean).forEach(([k, v]) => {
    html += `<div class="popup-row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  });

  obj.marker.bindPopup(html, { maxWidth: 300, minWidth: 220 }).openPopup();
  renderPanel();
}

// ── WebSocket ─────────────────────────────────────────────────────

function activeBbox() {
  if (customBbox) return customBbox;
  return REGIONS[document.getElementById('region').value] || REGIONS.manche;
}

function activeMessageTypes() {
  const t = [];
  if (filterBeacons) t.push('AidsToNavigationReport');
  if (filterVessels) t.push('PositionReport');
  return t;
}

function connect() {
  if (ws) {
    ws.close();
    return;
  }
  const key = document.getElementById('api-key').value.trim();
  if (!key) {
    alert('Entrez votre clé API aisstream.io\n\nInscription gratuite sur https://aisstream.io');
    return;
  }
  localStorage.setItem('ais-api-key', key);
  setStatus('connecting');
  /*
  ws = new WebSocket('wss://stream.aisstream.io/v0/stream');

  ws.onopen = () => {
    ws.send(JSON.stringify({
      APIKey:             key,
      BoundingBoxes:      [activeBbox()],
      FilterMessageTypes: activeMessageTypes()
    }));
    setStatus('connected');
    document.getElementById('connect-btn').textContent = 'Déconnecter';
    document.getElementById('connect-btn').classList.add('connected');
  };

  ws.onmessage = e => {
    msgCount++;
    document.getElementById('cnt-msgs').textContent = msgCount;
    try { dispatch(JSON.parse(e.data)); } catch (_) {}
  };

  ws.onclose = () => {
    ws = null;
    setStatus('disconnected');
    document.getElementById('connect-btn').textContent = 'Connecter';
    document.getElementById('connect-btn').classList.remove('connected');
  };

  ws.onerror = () => setStatus('error');

  */
  const socket = new WebSocket("wss://stream.aisstream.io/v0/stream");
  socket.addEventListener("open", (_) => {
    const subscriptionMessage = {
      APIkey: key,
      BoundingBoxes: [
        [
          [-180, -90],
          [180, 90],
        ],
      ],
    };
    console.log(JSON.stringify(subscriptionMessage));
    socket.send(JSON.stringify(subscriptionMessage));
  });

  socket.addEventListener("message", (event) => {
    let aisMessage = JSON.parse(event.data);
    if (aisMessage["MessageType"] === "PositionReport") {
      let positionReport = aisMessage["Message"]["PositionReport"];
      console.log(
        `ShipId: ${positionReport["UserID"]} Latitude: ${positionReport["Latitude"]} Longitude: ${positionReport["Longitude"]}`
      );
    }
  });

}

function dispatch(msg) {
  const mtype = msg.MessageType;
  const meta  = msg.MetaData || {};

  if (mtype === 'AidsToNavigationReport' && filterBeacons) {
    const d = msg.Message?.AidsToNavigationReport || {};
    updateObject({
      mmsi:    d.MMSI    ?? meta.MMSI,
      name:    (d.Name   ?? meta.ShipName ?? 'BALISE').trim().replace(/\s+/g, ' '),
      lat:     d.Latitude  ?? meta.latitude,
      lon:     d.Longitude ?? meta.longitude,
      type:    'beacon',
      subtype: d.TypeOfAidToNavigation ?? 0,
      offPos:  !!d.OffPosition,
      time:    meta.time_utc
    });

  } else if (mtype === 'PositionReport' && filterVessels) {
    const d = msg.Message?.PositionReport || {};
    updateObject({
      mmsi:    d.UserID   ?? meta.MMSI,
      name:    (meta.ShipName ?? `MMSI ${d.UserID}`).trim().replace(/\s+/g, ' '),
      lat:     d.Latitude  ?? meta.latitude,
      lon:     d.Longitude ?? meta.longitude,
      type:    'vessel',
      speed:   d.SpeedOverGround,
      heading: d.TrueHeading ?? d.CourseOverGround,
      time:    meta.time_utc
    });
  }
}

// ── panel ─────────────────────────────────────────────────────────

function renderPanel() {
  const all      = [...objects.values()];
  const beacons  = all.filter(o => o.data.type === 'beacon');
  const vessels  = all.filter(o => o.data.type === 'vessel');
  const mobiles  = all.filter(o => isMobile(o.positions));

  document.getElementById('cnt-beacons').textContent = beacons.length;
  document.getElementById('cnt-vessels').textContent = vessels.length;
  document.getElementById('cnt-mobile').textContent  = mobiles.length;
  document.getElementById('panel-count').textContent = all.length;

  const term = searchTerm.toLowerCase();
  const visible = all.filter(o => {
    if (!term) return true;
    const d = o.data;
    return (d.name || '').toLowerCase().includes(term)
        || String(d.mmsi).includes(term);
  });

  // tri : hors-position d'abord, puis mobiles, puis par nom
  visible.sort((a, b) => {
    if (a.data.offPos !== b.data.offPos) return a.data.offPos ? -1 : 1;
    const am = isMobile(a.positions), bm = isMobile(b.positions);
    if (am !== bm) return am ? -1 : 1;
    return (a.data.name || '').localeCompare(b.data.name || '', 'fr');
  });

  const list = document.getElementById('panel-list');
  list.innerHTML = '';

  visible.forEach(obj => {
    const d      = obj.data;
    const mobile = isMobile(obj.positions);
    const item   = document.createElement('div');
    item.className = 'obj-item' + (d.mmsi === focusedMmsi ? ' focused' : '');

    const icon = d.type === 'beacon'
      ? `<span class="${d.offPos ? 't-offpos' : 't-beacon'}">⚓</span>`
      : `<span class="t-vessel">⛵</span>`;
    const tags = [
      d.offPos  ? `<span class="t-offpos">hors-pos</span>` : '',
      mobile    ? `<span class="t-mobile">↕mobile</span>`  : '',
    ].filter(Boolean).join(' ');

    const age = d.lastSeen
      ? Math.round((Date.now() - d.lastSeen) / 1000) + 's'
      : '—';

    item.innerHTML = `
      <div class="oi-name">${icon} ${esc(d.name || `MMSI ${d.mmsi}`)} ${tags}</div>
      <div class="oi-meta">${(d.lat||0).toFixed(4)}, ${(d.lon||0).toFixed(4)} · ${obj.positions.length} pts · ${age}</div>
    `;
    item.addEventListener('click', () => {
      openPopup(d.mmsi);
      map.panTo([d.lat, d.lon]);
    });
    list.appendChild(item);
  });
}

// ── utilitaires ───────────────────────────────────────────────────

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function setStatus(s) {
  document.getElementById('status-dot').className = s;
  document.getElementById('status-text').textContent = {
    connecting:   'connexion…',
    connected:    'connecté',
    disconnected: 'déconnecté',
    error:        'erreur de connexion'
  }[s] ?? s;
}

// ── événements ────────────────────────────────────────────────────

document.getElementById('connect-btn').addEventListener('click', connect);

document.getElementById('use-view-btn').addEventListener('click', () => {
  const b = map.getBounds();
  customBbox = [[b.getSouth(), b.getWest()], [b.getNorth(), b.getEast()]];
  document.getElementById('status-text').textContent += ' (zone carte)';
});

document.getElementById('region').addEventListener('change', () => {
  customBbox = null;
});

document.getElementById('filter-beacons').addEventListener('click', function () {
  filterBeacons = !filterBeacons;
  this.classList.toggle('active', filterBeacons);
});

document.getElementById('filter-vessels').addEventListener('click', function () {
  filterVessels = !filterVessels;
  this.classList.toggle('active', filterVessels);
});

document.getElementById('search').addEventListener('input', function () {
  searchTerm = this.value.trim();
  renderPanel();
});

// mise à jour du panneau (âge des données) toutes les 10 s
setInterval(renderPanel, 10_000);

// restauration clé API
const savedKey = localStorage.getItem('ais-api-key');
if (savedKey) document.getElementById('api-key').value = savedKey;
</script>
